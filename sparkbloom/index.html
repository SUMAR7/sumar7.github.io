<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070b1f" />
    <title>Sparkbloom: Fireworks Puzzle</title>
    <meta name="description" content="Write messages and paint pictures in the night sky with fireworks. Send a fireworks greeting to anyone, free in your browser." />
    <meta property="og:title" content="Sparkbloom: a message in the sky" />
    <meta property="og:description" content="Someone wrote you a message in fireworks. Tap to watch it." />
    <script type="module" crossorigin src="./assets/index-W-_Xxkqa.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/dist-62TeNfsI.js">
    <link rel="modulepreload" crossorigin href="./assets/definitions-BdWVgBTV.js">
    <link rel="modulepreload" crossorigin href="./assets/definitions-DlpntO5o.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CMHiMDhg.css">
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <div id="title">
        <div class="logo">SPARK<span>BLOOM</span></div>
        <div class="how" aria-label="Hold to launch, let go to burst">
          <div class="step">
            <svg viewBox="0 0 64 64" class="ic hand" aria-hidden="true"><path d="M26 30V12a5 5 0 0 1 10 0v14l11 2.5a6 6 0 0 1 4.6 6.8L49 52a6 6 0 0 1-6 5H31a6 6 0 0 1-4.8-2.4l-9.8-13a4.5 4.5 0 0 1 6.6-6.1L26 38z" fill="#fff"/></svg>
            <b>HOLD</b>
          </div>
          <svg viewBox="0 0 24 24" class="arrow" aria-hidden="true"><path d="M5 12h12m-5-6 6 6-6 6" stroke="#ffc857" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="step">
            <svg viewBox="0 0 64 64" class="ic" aria-hidden="true"><g stroke="#ffc857" stroke-width="5" stroke-linecap="round"><path d="M32 6v12M32 46v12M6 32h12M46 32h12M13.6 13.6l8.5 8.5M41.9 41.9l8.5 8.5M50.4 13.6l-8.5 8.5M22.1 41.9l-8.5 8.5"/></g><circle cx="32" cy="32" r="5" fill="#fff"/></svg>
            <b>LET GO</b>
          </div>
        </div>
        <div class="tap" id="tap-word">TAP ANYWHERE</div>
        <div class="tv">◀ ▶ LANE &nbsp;·&nbsp; OK LAUNCH &nbsp;·&nbsp; OK BURST</div>
        <button id="b-free" class="btn"><svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="currentColor" stroke-width="6" stroke-linecap="round"><path d="M32 6v12M32 46v12M6 32h12M46 32h12M13.6 13.6l8.5 8.5M41.9 41.9l8.5 8.5M50.4 13.6l-8.5 8.5M22.1 41.9l-8.5 8.5"/></g></svg>FREE SHOW</button>
        <button id="b-letters" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z M3 7l9 6 9-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>SKY LETTERS</button>
        <div id="gift" hidden>A MESSAGE FOR YOU</div>
      </div>

      <div id="hud" hidden>
        <div id="jar" aria-label="Ember jar"><i id="jar-fill"></i><b id="jar-n"></b></div>
        <b id="lvl"></b>
      </div>
      <div id="corner"><button id="b-pause" class="ibtn" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.5" fill="currentColor"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5" fill="currentColor"/></svg></button></div>

      <div id="lanes" hidden></div>
      <div id="aim" hidden></div>
      <div id="hint" hidden>
        <svg viewBox="0 0 64 64" class="ic hand" aria-hidden="true"><path d="M26 30V12a5 5 0 0 1 10 0v14l11 2.5a6 6 0 0 1 4.6 6.8L49 52a6 6 0 0 1-6 5H31a6 6 0 0 1-4.8-2.4l-9.8-13a4.5 4.5 0 0 1 6.6-6.1L26 38z" fill="#fff"/></svg>
        <b>HOLD</b>
      </div>

      <div id="p-won" class="end" hidden>
        <div class="stars"><i></i><i></i><i></i></div>
        <div class="row">
          <button id="b-next" class="btn primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>NEXT</button>
          <button id="b-clip" class="btn" hidden>VIDEO</button>
          <button id="b-again" class="btn round" aria-label="Play again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 8A7.5 7.5 0 1 0 19.5 13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M19.5 3.5V8.5H14.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
      <div id="p-lost" class="end" hidden>
        <div id="lost-why" class="why"></div>
        <div class="row">
          <button id="b-retry" class="btn primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 8A7.5 7.5 0 1 0 19.5 13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M19.5 3.5V8.5H14.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>RETRY</button>
          <button id="b-easy" class="btn" hidden>EASY TRY</button>
        </div>
      </div>
      <div id="p-pause" class="dim" hidden>
        <div class="card">
          <button id="b-resume" class="btn primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>PLAY</button>
          <button id="b-restart" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 8A7.5 7.5 0 1 0 19.5 13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M19.5 3.5V8.5H14.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>RESTART</button>
          <button id="b-levels" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></g></svg>LEVELS</button>
          <button id="b-pic" class="btn" aria-label="Picture quality"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8 21h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span id="pic-label">AUTO</span></button>
          <button id="b-snd" class="btn" aria-label="Sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/><path class="x" d="M16 9l6 6m0-6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span id="snd-label">ON</span></button>
          <button id="b-home" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="currentColor"/></svg>HOME</button>
        </div>
      </div>
      <div id="p-levels" class="dim" hidden>
        <div class="card wide"><div id="grid"></div></div>
      </div>
      <div id="p-compose" class="dim" hidden>
        <div class="card wide compose">
          <div id="presets" class="row"></div>
          <input id="letter-text" type="text" maxlength="24" placeholder="Or type your own" autocomplete="off" aria-label="Your message" />
          <input id="letter-from" type="text" maxlength="16" placeholder="From (your name)" autocomplete="off" aria-label="Your name" />
          <div id="letter-colours" class="row"></div>
          <div id="letter-worlds" class="row"></div>
          <div id="letter-note" class="why small" hidden></div>
          <button id="b-write" class="btn primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>WRITE IT</button>
        </div>
      </div>
      <div id="p-letter" class="end" hidden>
        <div class="row">
          <button id="b-share" class="btn primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16a3 3 0 0 0-2.200.900L8.900 13a3 3 0 0 0 0-2l6.900-3.900A3 3 0 1 0 15 5l-6.900 3.900a3 3 0 1 0 0 6.200L15 19a3 3 0 1 0 3-3z" fill="currentColor"/></svg>SEND</button>
          <button id="b-own" class="btn primary" hidden>MAKE YOUR OWN</button>
          <button id="b-video" class="btn" hidden>VIDEO</button>
          <button id="b-get" class="btn" hidden>GET THE GAME</button>
          <button id="b-replay" class="btn round" aria-label="Play again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.500 8A7.500 7.500 0 1 0 19.500 13" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"/><path d="M19.500 3.500V8.500H14.500" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="b-edit" class="btn round" aria-label="Change the message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z" fill="currentColor"/></svg></button>
        </div>
      </div>
      <div id="palette" hidden></div>
      <div id="wipe"></div>
      <div id="toast"></div>
      <div id="fps"></div>
    </div>
  </body>
</html>
